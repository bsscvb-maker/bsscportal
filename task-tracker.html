d #243146}.taskText{font-size:14px;font-weight:550;line-height:1.55;overflow-wrap:anywhere}.row select{width:100%;background:#172335;border-color:#34455d;padding:8px;font-size:11px}.row .move-tier{display:none}.iconBtn{background:#172335;border-color:#34455d;padding:7px 10px}.row input[type=checkbox]{accent-color:#3bc7bb}.empty-tier{padding:4px 18px 20px;color:#8297b1;font-size:13px}.empty-results{padding:36px;text-align:center;border:1px dashed #34455d;border-radius:14px}#modal{padding:24px;overflow:auto}#modalBox{margin:7vh auto;width:480px;max-width:100%;background:#142031;border-color:#3a4e69;padding:24px}#modalBox input,#modalBox select{width:100%;font-size:14px;padding:12px;background:#0d1623;border-color:#41536d}#modalBox label{margin-top:18px}#modalActions{margin-top:24px}#modalActions button{padding:10px 20px}

main{max-width:1160px;padding:24px;margin:auto}header{position:static;border-radius:14px;margin-bottom:20px}header p{color:#9aacc1;font-size:12px}#add,#save{background:#3bc7bb;color:#062c29;border:0;font-weight:750}#stats{margin-bottom:20px}.toolbar{background:transparent;border:0;padding:0}.toolbar input,.toolbar select{background:#111c2a;color:white;border-color:#35445b}#status{display:none}#message{padding:12px 16px;border:1px solid #34465d;border-radius:10px;color:#aebed2}#message.error{color:#ffb3b3}#results{display:block}.task{background:transparent;color:#e8edf5;border-bottom:0}.task input{width:18px;height:18px}.status-ready{color:#ff4d4d;font-weight:800}.status-working{color:#4da6ff;font-weight:800}.status-waiting{color:#ffd24d;font-weight:800}.status-done{color:#5cff5c;font-weight:800}.hint{font-size:12px;color:#9aacc1}dialog{background:#142031;color:#e8edf5;border:1px solid #3a4e69}dialog input,dialog select,dialog textarea{background:#0d1623;color:white;border-color:#41536d}dialog button{background:#172335;color:white;border-color:#34455d}.filter-buttons button:hover{background:#243a54}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #60d5cd;outline-offset:3px}@media(max-width:700px){main{padding:14px}.row.task{grid-template-columns:24px minmax(0,1fr) 88px}.row.task>.btns{grid-column:3;grid-row:1 / span 2}.row.task>select{grid-column:2;grid-row:2;width:125px}.task input{grid-column:1;grid-row:1}.toolbar{gap:10px}.focus-dashboard{grid-template-columns:1fr}}
</style></head><body><main><header><div><h1>Task dashboard</h1><p>Choose a priority. Move one thing forward.</p></div><button id="add" class="primary" disabled>+ Add task</button></header><div id="focusDashboard" class="focus-dashboard"></div><div class="tracker-summary" id="stats"></div><div class="toolbar"><input id="search" type="search" aria-label="Search tasks" placeholder="Search tasks…"><select id="priority" aria-label="Priority"><option value="">All priorities</option></select><select id="status" aria-label="Status"><option value="all">All tasks</option><option value="ready">Ready</option><option value="working">Working</option><option value="waiting">Waiting</option><option value="done">Completed</option></select><div class="filter-buttons"><button type="button" data-filter="all">All</button><button type="button" data-filter="ready">Ready</button><button type="button" data-filter="working">Working</button><button type="button" data-filter="waiting">Waiting</button><button type="button" data-filter="done">Done</button></div><button id="refresh">Refresh</button></div><p id="message" role="status">Loading shared tasks…</p><div id="results"></div><dialog id="editor"><form id="form"><h2 id="editorTitle">Add task</h2><label>Task<textarea id="text" required maxlength="3000"></textarea></label><label>Notes<textarea id="notes" maxlength="10000" placeholder="Optional details or next steps"></textarea></label><label>Priority<select id="editPriority"></select></label><label>Status<select id="editStatus"><option value="ready">Ready</option><option value="working">Working</option><option value="waiting">Waiting</option><option value="done">Completed</option></select></label><p id="editMessage" role="status"></p><div class="actions"><button type="button" id="delete" class="danger">Delete</button><button type="button" id="cancel">Cancel</button><button class="primary" id="save">Save task</button></div></form></dialog></main><script>
'use strict';
const ENDPOINT='https://script.google.com/macros/s/AKfycbyCVOwhCtWJX2X7bQE9dVNKgtVt-TBt8HTioqFf9Xk1EY-XM8joKX9GS5a0gAzvwouZgw/exec';
const TIERS=[['tier1','🔴 Tier 1 — Critical / Must Do First'],['tier2','🟠 Tier 2 — High Impact Operations'],['tier3','🟡 Tier 3 — Revenue & Program Growth'],['tier4','🔵 Tier 4 — Brand / Identity'],['tier5','🟣 Tier 5 — Content / Nice-to-Have'],['parked','🟢 Done']];
const $=id=>document.getElementById(id);let tasks=[],baseline='',ready=false,busy=false,editing=null,collapsedTiers={};
function statusOf(t){return t.tier==='parked'?'done':(['ready','working','waiting','done'].includes(t.status)?t.status:'ready')}
function label(t){return TIERS.find(x=>x[0]===t)?.[1]||'Other tasks'}
function note(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}
async function read(){const r=await fetch(ENDPOINT+'?action=getAll&_='+Date.now(),{signal:AbortSignal.timeout(25000),cache:'no-store'});if(!r.ok)throw Error('Unable to load shared tasks.');const data=await r.json();if(!Array.isArray(data)||data.some(t=>!t||typeof t.text!=='string'||t.id==null))throw Error('The task service returned an unexpected response.');return data}
function lock(value){busy=value;$('add').disabled=!ready||value;$('refresh').disabled=value;$('save').disabled=value;$('delete').disabled=value;$('cancel').disabled=value;document.querySelectorAll('.task input,.task button,.task select,.focus-card button').forEach(e=>e.disabled=!ready||value)}
async function load(){if(busy)return;lock(true);note('Loading shared tasks…');try{tasks=await read();baseline=JSON.stringify(tasks);ready=true;render();note(tasks.length+' shared tasks · Up to date');}catch(e){ready=false;note(e.message+' Select Refresh to retry. Existing tasks have not been changed.',true);render()}finally{lock(false)}}
function render(){
 const states=['ready','working','waiting','done'];const counts=Object.fromEntries(states.map(s=>[s,tasks.filter(t=>statusOf(t)===s).length]));
 $('stats').replaceChildren();for(const state of states){const metric=document.createElement('div');metric.className='metric';metric.dataset.status=state;const strong=document.createElement('strong');strong.textContent=ready?counts[state]:'—';const span=document.createElement('span');span.textContent=state[0].toUpperCase()+state.slice(1);metric.append(strong,span);$('stats').append(metric)}
 $('focusDashboard').replaceChildren();for(const state of states.slice(0,3)){const card=document.createElement('section');card.className='focus-card';card.dataset.status=state;const h=document.createElement('h2');h.textContent=state[0].toUpperCase()+state.slice(1);card.append(h);const items=tasks.filter(t=>statusOf(t)===state).sort((a,b)=>TIERS.findIndex(x=>x[0]===a.tier)-TIERS.findIndex(x=>x[0]===b.tier)).slice(0,3);for(const task of items){const b=document.createElement('button');b.textContent=task.text;b.disabled=!ready||busy;b.onclick=()=>open(task);card.append(b)}if(!items.length){const p=document.createElement('p');p.textContent=ready?'No tasks in this section.':'Waiting for saved tasks';card.append(p)}$('focusDashboard').append(card)}
 const q=$('search').value.trim().toLowerCase(),filter=$('status').value,priority=$('priority').value;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter))});
 const visible=tasks.filter(t=>(!q||t.text.toLowerCase().includes(q))&&(!priority||groupOf(t)===priority)&&(filter==='all'||statusOf(t)===filter));$('results').replaceChildren();
 const groups=[...TIERS.map(t=>t[0]),...new Set(tasks.map(groupOf).filter(t=>!TIERS.some(x=>x[0]===t)))];for(const tier of groups){const list=visible.filter(t=>groupOf(t)===tier).sort((a,b)=>({working:0,ready:1,waiting:2,done:3}[statusOf(a)]-{working:0,ready:1,waiting:2,done:3}[statusOf(b)]));if(!list.length&&(q||filter!=='all'||priority))continue;const section=document.createElement('details');section.className='tier';section.id=tier;section.open=Boolean(q||filter!=='all'||(collapsedTiers[tier]===undefined?list.some(t=>statusOf(t)!=='done'):!collapsedTiers[tier]));section.addEventListener('toggle',()=>{collapsedTiers[tier]=!section.open});const summary=document.createElement('summary'),h=document.createElement('h2');h.textContent=label(tier);const count=document.createElement('span');count.className='tier-count';count.textContent=list.length;summary.append(h,count);section.append(summary);
 for(const task of list){const state=statusOf(task),row=document.createElement('article');row.className='row task '+(state==='done'?'completed':'');const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=state==='done';checkbox.disabled=!ready||busy;checkbox.setAttribute('aria-label',(checkbox.checked?'Reopen ':'Complete ')+task.text);checkbox.onchange=()=>change(task,checkbox.checked);const title=document.createElement('div');title.className='taskText '+(state==='done'?'done':state==='waiting'?'waiting':'');title.textContent=task.text;if(task.notes){const detail=document.createElement('p');detail.className='hint';detail.style.whiteSpace='pre-wrap';detail.textContent=task.notes;title.append(detail)}const status=document.createElement('select');status.className='status-'+state;status.setAttribute('aria-label','Status for '+task.text);for(const s of states)status.add(new Option(s.toUpperCase(),s));status.value=state;status.disabled=!ready||busy;status.onchange=()=>updateStatus(task,status.value);const buttons=document.createElement('div');buttons.className='btns';const edit=document.createElement('button');edit.className='iconBtn';edit.textContent='✎';edit.title='Edit task';edit.setAttribute('aria-label','Edit '+task.text);edit.disabled=!ready||busy;edit.onclick=()=>open(task);const del=document.createElement('button');del.className='iconBtn danger';del.textContent='×';del.title='Delete task';del.setAttribute('aria-label','Delete '+task.text);del.disabled=!ready||busy;del.onclick=async()=>{if(confirm('Delete this task?\n\n'+task.text))await persist(tasks.filter(t=>t.id!==task.id))};buttons.append(edit,del);row.append(checkbox,title,status,buttons);section.append(row)}
 if(!list.length){const p=document.createElement('p');p.className='empty-tier';p.textContent='No tasks here. Add one when you’re ready.';section.append(p)}$('results').append(section)}
 if(!visible.length&&(q||filter!=='all'||priority||!ready)){const e=document.createElement('div');e.className='empty-results';e.textContent=!ready?'Shared tasks are unavailable. Use Refresh to try again.':'No tasks match. Try another status or search.';$('results').replaceChildren(e)}
}
function groupOf(t){return statusOf(t)==='done'?'parked':t.tier}
async function updateStatus(task,status){const tier=status==='done'?'parked':task.tier==='parked'?(task.previousTier||'tier2'):task.tier;await persist(tasks.map(t=>t===task?{...t,status,tier,previousTier:status==='done'&&t.tier!=='parked'?t.tier:t.previousTier,updatedAt:new Date().toISOString(),completedAt:status==='done'?new Date().toISOString():''}:t))}
function taskSignature(list){return JSON.stringify(list.map(t=>[String(t.id),t.text,t.tier,t.status||'ready',t.notes||'']).sort((a,b)=>a[0].localeCompare(b[0])))}
async function persist(next){if(!ready||busy)return false;lock(true);note('Saving task…');try{const live=await read();if(JSON.stringify(live)!==baseline){tasks=live;baseline=JSON.stringify(live);render();throw Error('Tasks changed in another session. Review the refreshed list and try again.')}const r=await fetch(ENDPOINT,{method:'POST',body:new URLSearchParams({action:'saveAll',data:JSON.stringify({tasks:next})}),signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error('The task service could not save.');const saved=await read();tasks=saved;baseline=JSON.stringify(saved);render();if(taskSignature(saved)!==taskSignature(next))throw Error('The saved result could not be confirmed. The latest shared tasks are shown; review before retrying.');note(tasks.length+' shared tasks · Saved');return true}catch(e){note(e.message,true);$('editMessage').textContent=e.message;return false}finally{lock(false);render()}}
async function change(task,done){const next=tasks.map(t=>t===task?{...t,status:done?'done':'ready',tier:done?'parked':(t.previousTier|| (t.tier!=='parked'?t.tier:'tier2')),previousTier:done?(t.tier==='parked'?t.previousTier:t.tier):t.previousTier}:t);await persist(next)}
function open(task=null){if(!ready||busy)return;editing=task;const tier=task?.tier||'tier2';$('editPriority').replaceChildren();for(const [id,title] of TIERS.filter(t=>t[0]!=='parked'))$('editPriority').add(new Option(title,id));if(tier!=='parked'&&!TIERS.some(t=>t[0]===tier))$('editPriority').add(new Option(label(tier),tier));$('editorTitle').textContent=task?'Edit task':'Add task';$('text').value=task?.text||'';$('notes').value=task?.notes||'';$('editPriority').value=tier==='parked'?(task.previousTier||'tier2'):tier;$('editStatus').value=task?statusOf(task):'ready';$('delete').hidden=!task;$('editMessage').textContent='';$('editor').showModal();$('text').focus()}
$('form').onsubmit=async e=>{e.preventDefault();const text=$('text').value.trim();if(!text)return;const tier=$('editPriority').value,status=$('editStatus').value,patch={text,notes:$('notes').value.trim(),updatedAt:new Date().toISOString(),completedAt:status==='done'?(editing?.completedAt||new Date().toISOString()):'',status,tier:status==='done'?'parked':tier,previousTier:tier};const next=editing?tasks.map(t=>t.id===editing.id?{...t,...patch}:t):[...tasks,{id:crypto.randomUUID(),createdAt:Date.now(),...patch}];if(await persist(next))$('editor').close()};$('delete').onclick=async()=>{if(editing&&confirm('Delete this task?\n\n'+editing.text)&&await persist(tasks.filter(t=>t.id!==editing.id)))$('editor').close()};$('cancel').onclick=()=>$('editor').close();$('editor').addEventListener('cancel',e=>{if(busy)e.preventDefault()});$('add').onclick=()=>open();$('refresh').onclick=load;$('search').oninput=render;$('priority').onchange=render;$('status').onchange=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{$('status').value=b.dataset.filter;render()});for(const [id,title] of TIERS)$('priority').add(new Option(title,id));load();
</script></body></html>
