<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSSC Task Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#202735;font:15px/1.5 system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:24px}h1,h2,p{margin:0}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}header p{color:#677080;margin-top:5px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d5dae1;border-radius:9px;padding:9px 14px;background:white;color:#202735}button:hover{background:#edf0f4}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#b3233c;color:white;border-color:#b3233c}.primary:hover{background:#941d32}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat{padding:16px;background:white;border:1px solid #dfe3e9;border-radius:12px;text-align:left}.stat strong{display:block;font-size:28px}.stat span{color:#677080;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:16px;background:white;border:1px solid #dfe3e9;border-radius:12px;margin-bottom:14px}.toolbar input{flex:1;min-width:180px}input,select,textarea{border:1px solid #ccd2dc;border-radius:8px;padding:9px;background:white;color:#202735}#message{margin:12px 0;color:#526073}#message.error{color:#a41d35}#results{display:grid;gap:18px}.group{background:white;border:1px solid #dfe3e9;border-radius:12px;overflow:hidden}.group h2{font-size:16px;padding:14px 18px;background:#fafbfc;border-bottom:1px solid #e4e7ec;display:flex;justify-content:space-between}.task{display:grid;grid-template-columns:24px minmax(160px,1fr) 130px 90px;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid #edf0f3}.task:last-child{border:0}.task input{width:19px;height:19px;accent-color:#b3233c}.task.done .title{text-decoration:line-through;color:#758090}.tag{font-size:12px;border-radius:20px;padding:4px 10px;width:max-content}.ready{background:#fff0e2;color:#8c4816}.working{background:#e7efff;color:#2752a2}.waiting{background:#fff6d7;color:#795a00}.done .tag{background:#e5f4e9;color:#28603b}.empty{padding:35px;text-align:center;background:white;border:1px dashed #ccd2dc;border-radius:12px;color:#677080}dialog{border:0;border-radius:16px;width:520px;max-width:94vw;padding:24px;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#16203188}dialog label{display:grid;gap:6px;margin:15px 0}textarea{width:100%;resize:vertical;min-height:100px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.danger{color:#ae2340;margin-right:auto}.hint{font-size:12px;color:#748092}progress{width:100%;height:6px;accent-color:#b3233c;margin-bottom:15px}@media(max-width:650px){main{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.stat:first-child{grid-column:span 2}header{align-items:flex-start}.task{grid-template-columns:24px 1fr 65px}.tag{grid-column:2;grid-row:2}.task button{grid-column:3;grid-row:1 / span 2}.toolbar select{flex:1;min-width:140px}}
</style></head><body><main><header><div><h1>Task Tracker</h1><p>Club priorities, progress, and next steps.</p></div><button id="add" class="primary" disabled>+ Add task</button></header><div class="stats" id="stats"></div><progress id="progress" max="100" value="0" aria-label="Tasks completed"></progress><div class="toolbar"><input id="search" type="search" aria-label="Search tasks" placeholder="Search tasks…"><select id="priority" aria-label="Priority"><option value="">All priorities</option></select><select id="status" aria-label="Status"><option value="open">Open tasks</option><option value="all">All tasks</option><option value="ready">Ready</option><option value="working">Working</option><option value="waiting">Waiting</option><option value="done">Completed</option></select><button id="refresh">Refresh</button></div><p id="message" role="status">Loading shared tasks…</p><div id="results"></div><dialog id="editor"><form id="form"><h2 id="editorTitle">Add task</h2><label>Task<textarea id="text" required maxlength="3000"></textarea></label><label>Notes<textarea id="notes" maxlength="10000" placeholder="Optional details or next steps"></textarea></label><label>Priority<select id="editPriority"></select></label><label>Status<select id="editStatus"><option value="ready">Ready</option><option value="working">Working</option><option value="waiting">Waiting</option><option value="done">Completed</option></select></label><p id="editMessage" role="status"></p><div class="actions"><button type="button" id="delete" class="danger">Delete</button><button type="button" id="cancel">Cancel</button><button class="primary" id="save">Save task</button></div></form></dialog></main><script>
'use strict';
const ENDPOINT='https://script.google.com/macros/s/AKfycbyCVOwhCtWJX2X7bQE9dVNKgtVt-TBt8HTioqFf9Xk1EY-XM8joKX9GS5a0gAzvwouZgw/exec';
const TIERS=[['tier1','Critical / Must Do First'],['tier2','High Impact Operations'],['tier3','Revenue & Program Growth'],['tier4','Brand / Identity'],['tier5','Content / Nice-to-Have'],['parked','Completed']];
const $=id=>document.getElementById(id);let tasks=[],baseline='',ready=false,busy=false,editing=null;
function statusOf(t){return t.tier==='parked'?'done':(['ready','working','waiting','done'].includes(t.status)?t.status:'ready')}
function label(t){return TIERS.find(x=>x[0]===t)?.[1]||'Other tasks'}
function note(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}
async function read(){const r=await fetch(ENDPOINT+'?action=getAll&_='+Date.now(),{signal:AbortSignal.timeout(25000),cache:'no-store'});if(!r.ok)throw Error('Unable to load shared tasks.');const data=await r.json();if(!Array.isArray(data)||data.some(t=>!t||typeof t.text!=='string'||t.id==null))throw Error('The task service returned an unexpected response.');return data}
function lock(value){busy=value;$('add').disabled=!ready||value;$('refresh').disabled=value;$('save').disabled=value;$('delete').disabled=value;$('cancel').disabled=value;document.querySelectorAll('.task input,.task button').forEach(e=>e.disabled=!ready||value)}
async function load(){if(busy)return;lock(true);note('Loading shared tasks…');try{tasks=await read();baseline=JSON.stringify(tasks);ready=true;render();note(tasks.length+' shared tasks · Up to date');}catch(e){ready=false;note(e.message+' Select Refresh to retry. Existing tasks have not been changed.',true);render()}finally{lock(false)}}
function render(){const counts={all:tasks.length,ready:0,working:0,waiting:0,done:0};tasks.forEach(t=>counts[statusOf(t)]++);$('stats').replaceChildren();for(const [key,title] of [['all','Total tasks'],['ready','Ready'],['working','In progress'],['waiting','Waiting'],['done','Completed']]){const b=document.createElement('button');b.className='stat';const n=document.createElement('strong');n.textContent=counts[key];const s=document.createElement('span');s.textContent=title;b.append(n,s);b.onclick=()=>{$('status').value=key;render()};$('stats').append(b)}$('progress').value=tasks.length?counts.done/tasks.length*100:0;const q=$('search').value.trim().toLowerCase(),filter=$('status').value,priority=$('priority').value;const visible=tasks.filter(t=>(!q||t.text.toLowerCase().includes(q))&&(!priority||t.tier===priority)&&(filter==='all'||filter==='open'&&statusOf(t)!=='done'||statusOf(t)===filter));$('results').replaceChildren();const groups=[...TIERS.map(t=>t[0]),...new Set(tasks.map(t=>t.tier).filter(t=>!TIERS.some(x=>x[0]===t)))];for(const tier of groups){const list=visible.filter(t=>t.tier===tier).sort((a,b)=>({working:0,ready:1,waiting:2,done:3}[statusOf(a)]-{working:0,ready:1,waiting:2,done:3}[statusOf(b)]));if(!list.length)continue;const section=document.createElement('section');section.className='group';const heading=document.createElement('h2');heading.textContent=label(tier);const count=document.createElement('span');count.textContent=list.length;heading.append(count);section.append(heading);for(const task of list){const state=statusOf(task),row=document.createElement('article');row.className='task '+state;const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=state==='done';checkbox.disabled=!ready||busy;checkbox.setAttribute('aria-label',(checkbox.checked?'Reopen ':'Complete ')+task.text);checkbox.onchange=()=>change(task,checkbox.checked);const title=document.createElement('div');title.className='title';title.textContent=task.text;if(task.notes){const detail=document.createElement('p');detail.className='hint';detail.style.whiteSpace='pre-wrap';detail.textContent=task.notes;title.append(detail)}const badge=document.createElement('span');badge.className='tag '+state;badge.textContent={ready:'Ready',working:'In progress',waiting:'Waiting',done:'Completed'}[state];const edit=document.createElement('button');edit.textContent='Edit';edit.disabled=!ready||busy;edit.setAttribute('aria-label','Edit '+task.text);edit.onclick=()=>open(task);row.append(checkbox,title,badge,edit);section.append(row)}$('results').append(section)}if(!visible.length){const e=document.createElement('div');e.className='empty';e.textContent=!ready?'Shared tasks are unavailable. Use Refresh to try again.':tasks.length?'No tasks match these filters.':'No tasks yet. Add your first task.';$('results').append(e)}}
function taskSignature(list){return JSON.stringify(list.map(t=>[String(t.id),t.text,t.tier,t.status||'ready',t.notes||'']).sort((a,b)=>a[0].localeCompare(b[0])))}
async function persist(next){if(!ready||busy)return false;lock(true);note('Saving task…');try{const live=await read();if(JSON.stringify(live)!==baseline){tasks=live;baseline=JSON.stringify(live);render();throw Error('Tasks changed in another session. Review the refreshed list and try again.')}const r=await fetch(ENDPOINT,{method:'POST',body:new URLSearchParams({action:'saveAll',data:JSON.stringify({tasks:next})}),signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error('The task service could not save.');const saved=await read();tasks=saved;baseline=JSON.stringify(saved);render();if(taskSignature(saved)!==taskSignature(next))throw Error('The saved result could not be confirmed. The latest shared tasks are shown; review before retrying.');note(tasks.length+' shared tasks · Saved');return true}catch(e){note(e.message,true);$('editMessage').textContent=e.message;return false}finally{lock(false);render()}}
async function change(task,done){const next=tasks.map(t=>t===task?{...t,status:done?'done':'ready',tier:done?'parked':(t.previousTier|| (t.tier!=='parked'?t.tier:'tier2')),previousTier:done?(t.tier==='parked'?t.previousTier:t.tier):t.previousTier}:t);await persist(next)}
function open(task=null){if(!ready||busy)return;editing=task;const tier=task?.tier||'tier2';$('editPriority').replaceChildren();for(const [id,title] of TIERS.filter(t=>t[0]!=='parked'))$('editPriority').add(new Option(title,id));if(tier!=='parked'&&!TIERS.some(t=>t[0]===tier))$('editPriority').add(new Option(label(tier),tier));$('editorTitle').textContent=task?'Edit task':'Add task';$('text').value=task?.text||'';$('notes').value=task?.notes||'';$('editPriority').value=tier==='parked'?(task.previousTier||'tier2'):tier;$('editStatus').value=task?statusOf(task):'ready';$('delete').hidden=!task;$('editMessage').textContent='';$('editor').showModal();$('text').focus()}
$('form').onsubmit=async e=>{e.preventDefault();const text=$('text').value.trim();if(!text)return;const tier=$('editPriority').value,status=$('editStatus').value,patch={text,notes:$('notes').value.trim(),updatedAt:new Date().toISOString(),completedAt:status==='done'?(editing?.completedAt||new Date().toISOString()):'',status,tier:status==='done'?'parked':tier,previousTier:tier};const next=editing?tasks.map(t=>t.id===editing.id?{...t,...patch}:t):[...tasks,{id:crypto.randomUUID(),createdAt:Date.now(),...patch}];if(await persist(next))$('editor').close()};$('delete').onclick=async()=>{if(editing&&confirm('Delete this task?\n\n'+editing.text)&&await persist(tasks.filter(t=>t.id!==editing.id)))$('editor').close()};$('cancel').onclick=()=>$('editor').close();$('editor').addEventListener('cancel',e=>{if(busy)e.preventDefault()});$('add').onclick=()=>open();$('refresh').onclick=load;$('search').oninput=render;$('priority').onchange=render;$('status').onchange=render;for(const [id,title] of TIERS)$('priority').add(new Option(title,id));load();
</script></body></html>
